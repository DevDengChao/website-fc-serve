# https://github.com/Serverless-Devs/Serverless-Devs/blob/master/spec/zh/0.0.4/serverless_package_model/package_model.md#%E6%8F%92%E4%BB%B6%E6%A8%A1%E5%9E%8B%E5%85%83%E6%95%B0%E6%8D%AE
# https://www.serverless-devs.com/docs/dev-guide/plugin/
Edition: 3.0.0
Type: Plugin
Name: website-fc-serve
Provider:
  - 阿里云
Version: 1.6.0
Description: 使用 serve 代替 express 部署静态资源到 FC
HomePage: https://www.github.com/DevDengChao/website-fc-serve
Tags: #标签详情
  - Serverless Devs
  - 函数计算
Category: 其它
Service:
  其它:
Effective: Public
Parameters:
  type: object
  properties:
    index:
      type: string
      title: 默认首页文件名
      description: 自定义默认首页文件名
      default: index.html
    runtime:
      type: string
      title: 自定义函数运行时
      description: 覆盖默认 custom.debian11 运行时，例如 custom.debian12
      default: custom.debian11
    fallbackToIndex:
      type: boolean
      title: 首页兜底
      description: 是否对未匹配的路由返回首页（SPA 模式），对应 serve 的 -s 参数
      default: false
    version:
      type: string
      title: serve 版本
      description: serve 依赖的 npm 版本范围
      default: latest
